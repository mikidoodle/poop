<!doctype html>
<html>
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body { margin: 0; font-family: system-ui; background: #08131f; color: #fff; }

    <main><div class="planet"><h1>hello, orbit!</h1></div></main>
  <script>document.querySelector('.planet')?.addEventListener('click', () => {
  document.body.classList.toggle('clicked');
});</script></body>
</html>
